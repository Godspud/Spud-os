<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spud OS Downloads</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 50px 20px;
        }
        h1 {
            margin-bottom: 30px;
            text-align: center;
        }
        .download-section {
            background: #2e2e2e;
            border-radius: 10px;
            padding: 20px 30px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        a.button {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: #4caf50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        a.button:hover {
            background: #45a049;
        }
        p {
            margin: 10px 0 0;
        }
    </style>
</head>
<body>
    <h1>Spud OS Downloads</h1>

    <div class="download-section">
        <h2>Download the Source Code</h2>
        <p>Get the latest version of Spud OS from GitHub:</p>
        <a class="button" href="https://github.com/Godspud/Spud-os/archive/refs/heads/main.zip" target="_blank">Download Code (ZIP)</a>
    </div>

    <div class="download-section">
        <h2>Download All Fonts</h2>
        <p>Get all fonts used in Spud OS as a single ZIP file:</p>
        <a class="button" href="https://github.com/Godspud/Spud-os/raw/main/Fonts/Spud-Fonts.zip" target="_blank">Download Fonts (ZIP)</a>
        <p>Or download individual fonts:</p>
        <a class="button" href="https://github.com/Godspud/Spud-os/raw/main/Fonts/OpenDyslexicMono-Regular.otf" target="_blank">OpenDyslexicMono-Regular.otf</a><br>
        <a class="button" href="https://github.com/Godspud/Spud-os/raw/main/Fonts/TimesNewRoman.ttf" target="_blank">Times New Roman.ttf</a>
    </div>

</body>
</html>
